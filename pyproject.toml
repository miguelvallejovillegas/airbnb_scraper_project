[project]
name = "airbnb-scraper"
version = "0.1.0"
description = "Scrapes Airbnb listings for a city, scores them and writes a CSV"
requires-python = ">=3.11"
dependencies = [
    "pyairbnb>=2.2.2",
    "pandas>=2.2",
    "requests>=2.32",
]

[dependency-groups]
notebook = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airbnb_scraper"]
